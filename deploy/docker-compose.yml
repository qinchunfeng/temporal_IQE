name: iqe-v3
services:
  postgresql:
    image: postgres:16
    container_name: iqe-v3-postgresql
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    ports:
      - "5433:5432"
    volumes:
      - iqe-v3-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 3s
      retries: 12
  temporal:
    image: temporalio/auto-setup:1.28.1
    container_name: iqe-v3-temporal
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgresql
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address $$(hostname -i):7233 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
  temporal-ui:
    image: temporalio/ui:2.30.0
    container_name: iqe-v3-ui
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_UI_PORT: 8080
    ports:
      - "8280:8080"
volumes:
  iqe-v3-pgdata: